name: Publish Package to npmjs

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    environment: npmjs
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: 'https://registry.npmjs.org'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm run build

      # Fail before publishing an immutable npm version when the changelog lacks a release section.
      - name: Generate release notes
        run: |
          body="$(awk '
            /^## \[/ {
              if (tolower($2) == "[unreleased]") next
              if (found) exit
              found = 1
              next
            }
            found && NF { started = 1 }
            started { print }
          ' CHANGELOG.md)"
          if [ -z "$body" ]; then
            echo "release-notes: no ## [x.y.z] section in CHANGELOG.md" >&2
            exit 1
          fi
          printf '%s\n' "$body" > release-notes.md

      # npm runs a published package's install hooks in the *consumer's* project, and it reads them
      # from the registry metadata rather than the tarball's manifest. So package.json must stay
      # reduced for the whole publish, not just while the tarball is built - hence the explicit
      # strip/restore here rather than prepack/postpack.
      - name: Publish to npm
        run: |
          cp package.json package.json.bak
          jq '.scripts = { build: .scripts.build, dev: .scripts.dev }' package.json.bak > package.json
          npm publish --provenance || { cp package.json.bak package.json; exit 1; }
          cp package.json.bak package.json

      - name: Pack for release
        run: |
          jq '.scripts = { build: .scripts.build, dev: .scripts.dev }' package.json.bak > package.json
          pnpm pack
          cp package.json.bak package.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
          files: |
            ./vite-plugin-fvtt*.tgz
          body_path: release-notes.md
